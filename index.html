<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물품 대여 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header-left p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .admin-badge {
            background: rgba(255,255,255,0.3);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .admin-badge.hidden {
            display: none;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            margin-left: 10px;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .logout-btn.hidden {
            display: none;
        }
        
        .login-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .login-modal.hidden {
            display: none;
        }
        
        .login-content {
            background: white;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .login-content h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .login-content p {
            color: #999;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .login-form input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .login-form button {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        
        .login-error.show {
            display: block;
        }
        
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #eee;
            padding: 0 30px;
            background: #f8f9fa;
            flex-wrap: wrap;
        }
        
        .tab {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }
        
        .tab.locked {
            opacity: 0.5;
            cursor: not-allowed;
            color: #999;
        }
        
        .content {
            padding: 30px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .item-card {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            background: #f9f9f9;
        }
        
        .item-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        
        .item-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .rental-form {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* ⚠️ 대여 전 안내 모달 스타일 추가 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            color: #2d3748;
        }

        .modal-content p {
            margin-bottom: 20px;
            color: #4a5568;
            line-height: 1.5;
            text-align: left;
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3182ce;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-agree {
            background: #3182ce;
            color: white;
        }

        .firebase-status {
            display: inline-flex; align-items: center; gap: 6px;
            margin-left: 8px; padding: 4px 9px; border-radius: 999px;
            font-size: 12px; font-weight: 700;
            background: #f1f3f5; color: #666;
        }
        .firebase-status.connected { background: #e8f7ee; color: #16733b; }
        .firebase-status.offline { background: #fff3cd; color: #8a6d00; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>📦 학생회 물품 대여 <span id="firebaseStatus" class="firebase-status offline">연결 확인 중</span></h1>
                <p>학생회 물품을 효율적으로 관리하세요</p>
            </div>
            <div style="display: flex; align-items: center;">
                <div class="admin-badge hidden" id="adminBadge">
                    <span>👤</span> 관리자 모드
                </div>
                <button class="logout-btn hidden" id="logoutBtn" onclick="logout()">로그아웃</button>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('dashboard', this)">대시보드</button>
            <!-- ⚠️ 물품 대여 탭 클릭 시 모달이 먼저 뜨도록 연동 -->
            <button class="tab" id="rentalTabBtn" onclick="tryOpenRentalModal(this)">물품 대여</button>
            <button class="tab" onclick="switchTab('mySearch', this)">내 대여 조회</button>
            <button class="tab locked" id="historyTab" onclick="tryAccessHistory()">
                <span class="lock-icon">🔒</span> 대여 이력
            </button>
            <button class="tab locked" id="manageTab" onclick="tryAccessManage()">
                <span class="lock-icon">🔒</span> 물품 관리
            </button>
        </div>

        <div class="content">
            <!-- 대시보드 탭 -->
            <div id="dashboard" class="tab-content active">
                <div class="stats-summary" id="statsSummary"></div>
                <h2 style="margin-bottom: 20px; color: #333;">📊 물품 현황</h2>
                <div class="items-grid" id="dashboardItems"></div>
            </div>
           
            <!-- 물품 대여 탭 -->
            <div id="rental" class="tab-content">
                <div id="rentalSuccess" class="success-message" style="display: none;"></div>
                <div class="rental-form">
                    <h3 style="margin-bottom: 20px; color: #333;">새로운 대여 신청</h3>
                    
                    <!-- ⚠️ 4개 학과 선택 드롭다운 추가 -->
                    <div class="form-group">
                        <label>학과 선택 *</label>
                        <select id="renterDepartment" required>
                            <option value="">-- 학과를 선택하세요 --</option>
                            <option value="회계학과">회계학과</option>
                            <option value="무역학과">무역학과</option>
                            <option value="경영학과">경영학과</option>
                            <option value="경제학과">경제학과</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>이름 *</label>
                            <input type="text" id="renterName" placeholder="이름을 입력하세요">
                        </div>
                        <div class="form-group">
                            <label>학번 *</label>
                            <input type="text" id="renterStudentId" placeholder="예: 2024-12345">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>전화번호 *</label>
                        <input type="tel" id="renterPhone" placeholder="010-0000-0000">
                    </div>
                    <div class="form-group">
                        <label>대여 물품 선택 *</label>
                        <select id="itemSelect" onchange="updateAvailableCount()">
                            <option value="">물품을 선택하세요</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>대여 수량</label>
                        <input type="number" id="rentalQuantity" min="1" value="1">
                        <small style="color: #999; margin-top: 5px; display: block;" id="availableCount"></small>
                    </div>
                    <div class="form-group">
                        <label>대여 기한 (일)</label>
                        <input type="number" id="rentalDays" min="1" value="1">
                    </div>
                    <button class="btn btn-primary" onclick="submitRental()">대여 신청하기</button>
                </div>
            </div>

            <!-- 내 대여 조회 탭 -->
            <div id="mySearch" class="tab-content">
                <div class="rental-form">
                    <h3 style="margin-bottom: 20px; color: #333;">🔍 내 대여 내역 확인</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>이름</label>
                            <input type="text" id="searchName" placeholder="이름 입력">
                        </div>
                        <div class="form-group">
                            <label>학번</label>
                            <input type="text" id="searchStudentId" placeholder="학번 입력">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="searchMyRentals()">내 내역 조회하기</button>
                </div>
                <div id="mySearchResultContainer" style="display: none;">
                    <h3 style="margin-bottom: 15px; color: #333;" id="mySearchTitle">조회 결과</h3>
                    <div id="mySearchList" class="rental-list"></div>
                </div>
            </div>

            <!-- 대여 이력 탭 -->
            <div id="history" class="tab-content">
                <div class="restricted-notice" id="historyRestrictedNotice" style="display: none;">🔒 관리자만 접근 가능합니다</div>
                <h3 style="margin-bottom: 20px; color: #333;">📅 대여 이력</h3>
                <div id="rentalHistory" class="rental-list"></div>
            </div>

            <!-- 물품 관리 탭 -->
            <div id="manage" class="tab-content">
                <div class="restricted-notice" id="restrictedNotice" style="display: none;">🔒 관리자만 접근 가능합니다</div>
                <h3 style="margin-bottom: 20px; color: #333;">📋 물품 관리</h3>
                <div id="managedItems" class="rental-list"></div>
            </div>
        </div>
    </div>

    <!-- ⚠️ 대여 전 안내 모달 팝업 추가 -->
    <div id="rentalModal" class="modal">
        <div class="modal-content">
            <h2>⚠️ 대여 전 유의사항 안내</h2>
            <p>
                1. 분실시 개인이 비용을 지불해야 합니다.<br>
                2. 연체시 연체 기간만큼 대여가 불가능합니다.
            </p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeRentalModal()">취소</button>
                <button class="btn btn-agree" onclick="agreeRentalModal()">동의하고 대여하기</button>
            </div>
        </div>
    </div>

    <!-- 초기 선택 화면 (관리자/학생) -->
    <div class="login-modal" id="selectModal">
        <div class="login-content">
            <h2>👋 환영합니다!</h2>
            <p>당신은 누구신가요?</p>
            <div class="login-form" style="gap: 25px;">
                <button onclick="selectStudent()" style="background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%); padding: 15px; font-size: 16px;">
                    👨‍🎓 학생 (물품 대여 및 조회)
                </button>
                <button onclick="showAdminLogin()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px; font-size: 16px;">
                    👤 관리자 (물품 관리)
                </button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 모달 제어 함수
        function tryOpenRentalModal(btnElement) {
            document.getElementById('rentalModal').style.display = 'flex';
        }

        function closeRentalModal() {
            document.getElementById('rentalModal').style.display = 'none';
        }

        function agreeRentalModal() {
            document.getElementById('rentalModal').style.display = 'none';
            // 대여 탭으로 이동
            const rentalTabBtn = document.querySelectorAll('.tab')[1];
            switchTab('rental', rentalTabBtn);
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if(element) element.classList.add('active');
        }

        function selectStudent() {
            document.getElementById('selectModal').classList.add('hidden');
        }
    </script>
</body>
</html>
